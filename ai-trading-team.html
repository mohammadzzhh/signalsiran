<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Multi-Analyst Trading Team</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mut:#6b7380;--bd:#e1e4ea;--g:#0f9d58;--r:#d93025;--y:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e6e9ef;--mut:#8b94a3;--bd:#272d38;--g:#34c26f;--r:#f0564a;--y:#e0a43a}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e6e9ef;--mut:#8b94a3;--bd:#272d38;--g:#34c26f;--r:#f0564a;--y:#e0a43a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;font-size:14px;padding:12px;max-width:760px;margin-inline:auto}
h1{font-size:17px;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{flex:1;min-width:70px;text-align:center}.stat b{display:block;font-size:20px}.stat span{color:var(--mut);font-size:11px}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--tx);color:var(--bg)}
.warn{color:var(--y)}.L{color:var(--g)}.S{color:var(--r)}.N{color:var(--mut)}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer;direction:ltr}
.item:last-child{border:0}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid currentColor}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;text-align:center}
.grid div{background:var(--bg);border-radius:8px;padding:6px}.grid small{display:block;color:var(--mut);font-size:10px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;direction:ltr;font-size:12px}
.bar i{flex:1;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i u{display:block;height:100%;background:var(--g)}
.bar span{width:90px}.bar em{width:44px;text-align:right;font-style:normal}
ol,ul{padding-inline-start:20px;margin:6px 0}
svg{width:100%;height:auto;direction:ltr}
input[type=range]{vertical-align:middle}
</style>
</head>
<body>
<h1>🤖 AI Multi-Analyst Trading Team</h1>
<div class="card">
  <div class="row"><span id="st">...</span><span style="flex:1"></span>
    <button onclick="live()">اتصال زنده</button><button onclick="newSeed()">اسکن جدید</button></div>
  <div class="row" style="margin-top:8px"><span>حداقل امتیاز: <b id="thv">75</b></span>
    <input type="range" min="60" max="90" value="75" id="th" oninput="scan()"></div>
  <div id="stats" class="row" style="margin-top:8px"></div>
</div>
<div class="row" id="flt" style="margin-bottom:8px"></div>
<div class="card" id="list"></div>
<div id="det"></div>
<p class="N" style="font-size:11px">نسخه اجرایی V1 — فقط داده عمومی بازار، بدون معامله واقعی. امتیازدهی deterministic است و سیگنال تضمین سود نیست.</p>

<script>
const $=s=>document.querySelector(s);
const NAMES="BTC ETH SOL XRP DOGE ADA AVAX LINK DOT SUI BNB LTC TRX NEAR APT ARB OP INJ TIA SEI FIL ATOM UNI AAVE ETC BCH XLM HBAR RUNE PEPE WIF FET RNDR IMX STX ENA TON".split(" ");
let DATA=[],mode='SIM',seed=7,RES=[],filter='ALL',sel=null;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.283*r())}
// ---------- Data (simulated 15M candles, deterministic by seed) ----------
function gen(sd,sc){
  const r=rng(sd);let p=5+r()*900;const s0=.0014,out=[];
  const push=(d,s,vm=1)=>{const o=p,c=o*(1+d+s*gauss(r));
    const h=Math.max(o,c)*(1+Math.abs(gauss(r))*s*.4),l=Math.min(o,c)*(1-Math.abs(gauss(r))*s*.4);
    out.push({o,h,l,c,v:1e3*vm*(1+Math.abs(c-o)/o/s)*(.7+r())});p=c};
  if(sc==='N'){let d=0;for(let i=0;i<960;i++){if(i%120==0)d=(r()-.5)*.0004;push(d,s0)}}
  else{
    for(let i=0;i<40;i++)push(0,s0);
    for(let i=0;i<850;i++)push(.0003,s0);
    for(let i=0;i<60;i++)push(-.0006,s0);
    const lo=Math.min(...out.slice(-30).map(x=>x.l)),o=p,c=Math.max(o*1.001,lo*1.002);
    out.push({o,h:c*1.001,l:lo*.996,c,v:4e3});p=c;
    for(let i=0;i<6;i++)push(.0035,s0*.4,3);
    for(let i=0;i<6;i++)push(-.0021,s0*.5,1);
    if(sc==='S'){const K=out[0].o*out[0].o;return out.map(x=>({o:K/x.o,h:K/x.l,l:K/x.h,c:K/x.c,v:x.v}))}
  }
  return out;
}
function simData(){const r=rng(seed*91);return NAMES.map((n,i)=>{const q=r();return{sym:n+"USDT",c:gen(seed*1000+i,q<.3?'L':q<.5?'S':'N')}})}
// ---------- Helpers ----------
function agg(c,n){const o=[];for(let i=c.length%n;i+n<=c.length;i+=n){const g=c.slice(i,i+n);o.push({o:g[0].o,h:Math.max(...g.map(x=>x.h)),l:Math.min(...g.map(x=>x.l)),c:g[n-1].c,v:g.reduce((a,x)=>a+x.v,0)})}return o}
function ema(a,n){const k=2/(n+1);return a.reduce((e,x,i)=>i?e+(x-e)*k:x,a[0])}
function atr(c,n=14){const s=c.slice(-n-1);let t=0;for(let i=1;i<s.length;i++)t+=Math.max(s[i].h-s[i].l,Math.abs(s[i].h-s[i-1].c),Math.abs(s[i].l-s[i-1].c));return t/n}
const trend=x=>{const c=x.map(k=>k.c),e20=ema(c,20),e50=ema(c,50),l=c[c.length-1];return e20>e50&&l>e50?1:e20<e50&&l<e50?-1:0};
// ---------- Analysts (long-normalised; short = mirrored prices) ----------
function ana(c15,sg){
  const T=sg>0?x=>x:x=>({o:-x.o,h:-x.l,l:-x.h,c:-x.c,v:x.v});
  const a=c15.map(T),h1=agg(a,4),h4=agg(a,16),n=a.length-1,A=atr(a),A4=atr(h4);
  const t4=trend(h4),t1=trend(h1),g=[],why=[];
  // Liquidity: sweep + reclaim
  let sw=-1;for(let i=n-1;i>=n-30&&sw<0;i--){const lv=Math.min(...a.slice(i-30,i-4).map(x=>x.l));if(a[i].l<lv&&a[i].c>lv)sw=i}
  // Structure: MSS after sweep
  let lh=0,mss=-1;if(sw>=0){lh=Math.max(...a.slice(sw-6,sw).map(x=>x.h));for(let j=sw+1;j<=n;j++)if(a[j].c>lh){mss=j;break}}
  // Displacement
  let body=0,disp=0;if(mss>0){for(let j=sw;j<=mss;j++)body=Math.max(body,(a[j].c-a[j].o)/A);disp=body>1.5?10:body>1?5:0}
  // Retest
  let rt=false;if(mss>0&&mss<n){rt=Math.min(...a.slice(mss+1).map(x=>x.l))<=lh+A&&a[n].c>=lh}
  // 4H zone
  const z4=h4.slice(-10);let zi=0;z4.forEach((k,i)=>{if(k.l<z4[zi].l)zi=i});
  const zl=z4[zi].l,zu=zl+.6*A4,touches=z4.slice(zi+1).filter(k=>k.l<=zu).length,inv=h4[h4.length-1].c<zl;
  const near=sw>=0&&a[sw].l<=zu+.3*A4&&a[n].c-zl>=A4*.5;
  // Candle
  let cd=0;for(let i=n-5;i<=n;i++){const p=a[i-1],k=a[i],bd=Math.abs(k.c-k.o),lw=Math.min(k.o,k.c)-k.l;
    if((k.c>k.o&&p.c<p.o&&k.c>p.o&&k.o<p.c)||(lw>2*bd&&k.c>k.o))cd=1}
  // Volume + momentum
  const lv=a.slice(-6),rv=(lv.reduce((s,x)=>s+x.v,0)/6)/(a.slice(-36,-6).reduce((s,x)=>s+x.v,0)/30);
  const up=lv.filter(x=>x.c>x.o).reduce((s,x)=>s+x.v,0),dn=lv.filter(x=>x.c<=x.o).reduce((s,x)=>s+x.v,0);
  const roc=(a[n].c-a[n-6].c)/A;
  // Levels
  const entry=a[n].c,sl=sw>=0?a[sw].l-.3*A:entry-A,R=entry-sl,H=Math.max(...a.slice(-150).map(x=>x.h));
  const rr=R>0?(H-entry)/R:0,rp=R/entry;
  const tp1=entry+1.5*R,tp2=entry+2.5*R,tp3=entry+Math.min(8*R,Math.max(4*R,H-entry));
  // Gates (No-Trade conditions)
  if(t4<0)g.push("تضاد با روند 4H");
  if(sw<0)g.push("Sweep ندارد");else if(mss<0)g.push("MSS ندارد");else if(!rt)g.push("Retest انجام نشده");
  if(inv||!near)g.push("ناحیه Demand/Supply نامعتبر یا دور");
  if(rr<1.5)g.push("RR کمتر از 1.5");
  if(rp<.001||rp>.04)g.push("SL غیرمنطقی");
  if(disp===0&&mss>0)g.push("Displacement ضعیف");
  const dm=Math.min(10,disp*.7+(roc>1?3:roc>0?1.5:0));
  const v={"4H Context":t4>0?(t1>0?20:15):t4==0?(t1>0?8:4):0,"Liquidity":sw>=0?15:0,"Structure":mss>0?15:0,
    "Zone":near&&!inv?6+(touches==0?4:touches<3?2:0):0,"Candle":cd?8:3,"Displacement/Mom":Math.round(dm),
    "Volume":rv>1.3&&up>dn?5:dn>2*up?0:rv>1?3:1,"Entry Quality":rt?5:0,"RR":rr>=2.4?5:rr>=1.5?3:0,"Risk":5};
  const mx={"4H Context":20,"Liquidity":15,"Structure":15,"Zone":10,"Candle":10,"Displacement/Mom":10,"Volume":5,"Entry Quality":5,"RR":5,"Risk":5};
  const score=Object.values(v).reduce((s,x)=>s+x,0);
  const nm=sg>0?"Bullish":"Bearish",lq=sg>0?"SSL":"BSL";
  if(t4>0)why.push("روند 4H "+nm);if(near)why.push("قیمت در/نزدیک ناحیه "+(sg>0?"Demand":"Supply")+(touches==0?" (Fresh)":""));
  if(sw>=0)why.push(lq+" Sweep و Reclaim");if(mss>0)why.push(nm+" MSS تأیید شد");if(disp)why.push("Displacement "+(disp>=10?"قوی":"معمولی"));
  if(rt)why.push("Retest انجام شد");if(cd)why.push("کندل تأییدی");if(v.Volume>=3)why.push("حجم همسو");why.push("RR = "+rr.toFixed(1));
  const f=x=>sg*x;
  return{dir:sg>0?"LONG":"SHORT",score,v,mx,gates:g,why,sw,mss,
    entry:f(entry),sl:f(sl),tp1:f(tp1),tp2:f(tp2),tp3:f(tp3),rr,
    ser:c15.slice(-100).map(x=>x.c)};
}
const grade=s=>s>=85?"A+":s>=75?"A":s>=65?"B":"-";
const risk={"A+":1.5,"A":1,"B":.5};
function scan(){
  const thr=+$("#th").value;$("#thv").textContent=thr;
  RES=[];
  for(const d of DATA){
    const L=ana(d.c,1),S=ana(d.c,-1),b=(L.score>=S.score?L:S);
    if(b.sw<0)continue;
    b.sym=d.sym;b.grade=grade(b.score);RES.push(b);
  }
  RES.sort((x,y)=>y.score-x.score);
  const cnt={LONG:0,SHORT:0};
  for(const b of RES){
    if(!b.gates.length&&b.score>=thr){
      cnt[b.dir]++;
      if(cnt[b.dir]>2&&b.score<90){b.gates.push("Correlation Too High (حداکثر 2 هم‌جهت)")}
    }
    b.status=b.gates.length?(b.mss>0?"NO TRADE":"WATCHING"):b.score>=thr?"CONFIRMED":"NO TRADE";
    if(b.status==="CONFIRMED")b.risk=risk[b.grade]||.5;
  }
  render();
}
// ---------- UI ----------
function setSt(k){const m={ok:`<b class="L">🟢 CONNECTED</b> · ${mode==='LIVE'?'LIVE DATA':'SIMULATED DATA'}`,connecting:'<b class="warn">CONNECTING…</b>',warn:'<b class="warn">⚠ DATA WARNING</b> اتصال زنده ممکن نشد؛ داده شبیه‌سازی استفاده می‌شود'};$("#st").innerHTML=m[k]}
function render(){
  const sig=RES.filter(b=>b.status==="CONFIRMED");
  $("#stats").innerHTML=[["Scanned",DATA.length],["Candidates",RES.length],["Signals",sig.length],["A+",sig.filter(b=>b.grade==="A+").length],["A",sig.filter(b=>b.grade==="A").length]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
  $("#flt").innerHTML=["ALL","LONG","SHORT","A+","A","NO TRADE"].map(f=>`<button class="${f===filter?'on':''}" onclick="filter='${f}';render()">${f}</button>`).join("");
  const rows=RES.filter(b=>filter==="ALL"||(filter==="LONG"||filter==="SHORT"?b.dir===filter&&b.status==="CONFIRMED":filter==="NO TRADE"?b.status!=="CONFIRMED":b.grade===filter&&b.status==="CONFIRMED"));
  $("#list").innerHTML=rows.length?rows.map((b,i)=>{const c=b.status==="CONFIRMED";
    return`<div class="item" onclick="pick('${b.sym}')"><span>#${i+1} <b>${b.sym}</b></span><span class="${c?(b.dir==="LONG"?'L':'S'):'N'}">${c?(b.dir==="LONG"?"🟢 LONG":"🔴 SHORT"):"⚪ "+b.status}</span><span>${b.score} <span class="badge">${b.grade}</span></span></div>`}).join(""):'<span class="N">هیچ موقعیتی با این فیلتر وجود ندارد — کیفیت مهم‌تر از تعداد است.</span>';
  if(!sel||!RES.find(b=>b.sym===sel))sel=(RES.find(b=>b.status==="CONFIRMED")||RES[0]||{}).sym;
  detail();
}
function pick(s){sel=s;detail();$("#det").scrollIntoView({behavior:"smooth"})}
function fmt(x){return x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toFixed(6)}
function spark(b){
  const lv=[b.entry,b.sl,b.tp1,b.tp2,b.tp3],all=b.ser.concat(lv),mn=Math.min(...all),mx=Math.max(...all),y=p=>110-(p-mn)/(mx-mn)*100,x=i=>i*2.4;
  const col=["#888","var(--r)","var(--g)","var(--g)","var(--g)"],nm=["E","SL","TP1","TP2","TP3"];
  return`<svg viewBox="0 0 300 120"><polyline fill="none" stroke="var(--tx)" stroke-width="1.2" points="${b.ser.map((p,i)=>x(i)+","+y(p)).join(" ")}"/>`+
   lv.map((p,i)=>`<line x1="0" x2="300" y1="${y(p)}" y2="${y(p)}" stroke="${col[i]}" stroke-dasharray="3 3" stroke-width=".8"/><text x="2" y="${y(p)-2}" font-size="7" fill="${col[i]}">${nm[i]}</text>`).join("")+`</svg>`;
}
function detail(){
  const b=RES.find(r=>r.sym===sel);if(!b){$("#det").innerHTML="";return}
  const c=b.status==="CONFIRMED",cl=b.dir==="LONG"?"L":"S";
  $("#det").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;direction:ltr"><b style="font-size:16px">${b.sym}</b>
   <b class="${c?cl:'N'}">${c?(b.dir==="LONG"?"🟢 LONG":"🔴 SHORT"):"⚪ "+b.status}</b><b>${b.score}/100 · ${b.grade}</b></div>
   ${spark(b)}
   <div class="grid"><div><small>ENTRY</small>${fmt(b.entry)}</div><div><small>STOP</small>${fmt(b.sl)}</div><div><small>RISK</small>${c?b.risk+"%":"—"}</div>
   <div><small>TP1 (50%→BE)</small>${fmt(b.tp1)}</div><div><small>TP2 (25%)</small>${fmt(b.tp2)}</div><div><small>TP3 (Runner)</small>${fmt(b.tp3)}</div></div>
   ${c?"":`<p class="warn">دلایل NO TRADE:</p><ul>${b.gates.map(g=>`<li>${g}</li>`).join("")||"<li>امتیاز کمتر از حد نصاب</li>"}</ul>`}
   <p><b>TEAM ANALYSIS</b></p>
   ${Object.keys(b.v).map(k=>`<div class="bar"><span>${k}</span><i><u style="width:${b.v[k]/b.mx[k]*100}%"></u></i><em>${b.v[k]}/${b.mx[k]}</em></div>`).join("")}
   <p><b>WHY ${b.dir}?</b></p><ol>${b.why.map(w=>`<li>${w}</li>`).join("")}</ol></div>`;
}
function newSeed(){seed=Math.floor(Math.random()*9999)+1;mode='SIM';DATA=simData();setSt('ok');sel=null;scan()}
async function live(){
  setSt('connecting');
  try{
    const t=await(await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr')).json();
    const top=t.filter(x=>x.symbol.endsWith('USDT')).sort((a,b)=>b.quoteVolume-a.quoteVolume).slice(0,40),out=[];
    for(const x of top){const k=await(await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${x.symbol}&interval=15m&limit=1000`)).json();
      out.push({sym:x.symbol,c:k.slice(0,-1).map(r=>({o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5]}))})} // فقط کندل بسته‌شده
    DATA=out;mode='LIVE';setSt('ok');sel=null;scan();
  }catch(e){mode='SIM';setSt('warn')}
}
DATA=simData();setSt('ok');scan();
</script>
</body>
</html>
